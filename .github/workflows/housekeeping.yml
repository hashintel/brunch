name: Housekeeping

on:
  pull_request:
    paths:
      - ".github/workflows/housekeeping.yml"
      - ".github/renovate.json"
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:
    inputs:
      repoCache:
        description: "Reset or disable the cache?"
        type: choice
        default: enabled
        options:
          - enabled
          - disabled
          - reset
      logLevel:
        description: "Override default log level"
        type: choice
        default: info
        options:
          - "debug"
          - "info"
          - "warn"
          - "error"
      overrideSchedule:
        description: "Override all schedules"
        type: boolean
        default: false
      dryRun:
        description: "Dry run mode"
        type: choice
        default: disabled
        options:
          - disabled
          - extract
          - lookup
          - full

permissions:
  actions: read
  contents: write
  id-token: write

jobs:
  renovate:
    name: Dependencies
    uses: hashintel/.github/.github/workflows/housekeeping-dependencies.yml@a0df113e5602f3b721bf306bf6050ee2a0866956
    with:
      repoCache: ${{ inputs.repoCache || 'enabled' }}
      logLevel: ${{ inputs.logLevel || 'info' }}
      overrideSchedule: ${{ inputs.overrideSchedule || false }}
      dryRun: ${{ inputs.dryRun || 'disabled' }}
    secrets: inherit
