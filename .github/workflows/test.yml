name: Test

on:
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Full gate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm

      - name: Configure git identity
        # The current slow tests in test:full create real repositories and commits.
        run: |
          git config --global user.email "ci@brunch.invalid"
          git config --global user.name "Brunch CI"
          git config --global init.defaultBranch main

      - name: Install
        run: npm ci

      - name: Check (read-only lint + format + skills)
        run: npm run check

      - name: Test (full suite incl. slow tests)
        run: npm run test:full

      - name: Build
        run: npm run build
