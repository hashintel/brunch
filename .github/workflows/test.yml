name: Test

on:
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Full gate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm

      - name: Select test lanes
        id: test-lanes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: node scripts/ci-test-lanes.mjs

      - name: Configure git identity
        # The current slow tests in test:full create real repositories and commits.
        run: |
          git config --global user.email "ci@brunch.invalid"
          git config --global user.name "Brunch CI"
          git config --global init.defaultBranch main

      - name: Install native test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes expect ripgrep zsh

      - name: Install
        run: npm ci

      - name: Check release intent
        if: >-
          github.event_name == 'pull_request' &&
          github.base_ref == 'next' &&
          !startsWith(github.head_ref, 'changeset-release/')
        env:
          BASE_REF: ${{ github.base_ref }}
        run: npx changeset status --since="origin/$BASE_REF"

      - name: Check (read-only lint + format + skills)
        run: npm run check

      - name: Test (default + non-comparison slow)
        run: npm run test && npm run test:slow:core

      - name: Test (expensive comparison oracles)
        if: steps.test-lanes.outputs.comparison == 'true'
        run: npm run test:comparison

      - name: Build
        run: npm run build
